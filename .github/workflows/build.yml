name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
      - name: Fetch nodejs-mobile libnode
        run: |
          curl -fsSL -o /tmp/nodejs-mobile.zip https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          unzip -q /tmp/nodejs-mobile.zip -d /tmp/nodejs-mobile
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp/include
          cp "$(find /tmp/nodejs-mobile -path '*arm64-v8a*libnode.so' | head -1)" app/src/main/jniLibs/arm64-v8a/libnode.so
          NODE_H="$(find /tmp/nodejs-mobile -name node.h | head -1)"
          cp -r "$(dirname "$NODE_H")" app/src/main/cpp/include/node
          ls -lh app/src/main/jniLibs/arm64-v8a/libnode.so app/src/main/cpp/include/node/node.h
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
